name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pygame-ce
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Hardware report
        run: python -m retroforge --probe --home rf-ci-home
      - name: UI smoke test (headless walkthrough of all screens)
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python tools/make_demo_library.py rf-ui-home
          python tools/screenshot.py screenshots --home rf-ui-home
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: ui-screenshots
          path: screenshots/

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n + shellcheck (errors only)
        run: |
          for f in os/build.sh os/qemu-test.sh os/rootfs/usr/local/bin/* os/rootfs/usr/local/sbin/*; do
            bash -n "$f"
          done
          shellcheck -S error os/build.sh os/qemu-test.sh os/rootfs/usr/local/bin/* os/rootfs/usr/local/sbin/*
