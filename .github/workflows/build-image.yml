name: Build OS image (experimentell)

# Manually started: Actions → "Build OS image" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build-Profil
        type: choice
        options: [pc-x86_64, pc-i686, arm64-uefi, rpi-arm64, rpi-armhf, riscv64]
        default: pc-x86_64
      bundle:
        description: Emulatoren ins Image bündeln
        type: boolean
        default: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap qemu-user-static binfmt-support dosfstools exfatprogs \
            e2fsprogs fdisk grub-pc-bin grub-efi-amd64-bin curl gpg rsync xz-utils debian-archive-keyring
      - name: Image bauen
        run: sudo ./os/build.sh ${{ inputs.profile }} ${{ inputs.bundle && '--bundle' || '' }} --out "$PWD/out"
      - uses: actions/upload-artifact@v4
        with:
          name: retroforge-${{ inputs.profile }}
          path: out/*.img.xz
          compression-level: 0
