name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          python -m pip install pygame-ce
          python -m unittest discover -s tests
      - name: Source archive + checksums
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          NAME="retroforge-os-${TAG#v}"
          git archive --format=tar.gz --prefix="$NAME/" -o "$NAME.tar.gz" HEAD
          git archive --format=zip --prefix="$NAME/" -o "$NAME.zip" HEAD
          sha256sum "$NAME.tar.gz" "$NAME.zip" > SHA256SUMS
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" retroforge-os-*.tar.gz retroforge-os-*.zip SHA256SUMS --clobber
