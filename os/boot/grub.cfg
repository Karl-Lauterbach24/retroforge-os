set timeout=0
set timeout_style=hidden
set default=0
insmod all_video
insmod gfxterm
set gfxpayload=keep
search --no-floppy --label RF-ROOT --set=root

menuentry "RetroForge OS" {
    linux /boot/vmlinuz-@KVER@ @CMDLINE@
    initrd /boot/initrd.img-@KVER@
}
menuentry "RetroForge OS (sicherer Grafikmodus)" {
    linux /boot/vmlinuz-@KVER@ @CMDLINE@ nomodeset retroforge.safe=1
    initrd /boot/initrd.img-@KVER@
}
menuentry "RetroForge OS (Konsole / Wartung)" {
    linux /boot/vmlinuz-@KVER@ root=LABEL=RF-ROOT rw systemd.unit=multi-user.target retroforge.maintenance=1
    initrd /boot/initrd.img-@KVER@
}
