# RISC-V boards with UEFI (VisionFive 2 with recent U-Boot, Milk-V, QEMU). Experimental:
# few prebuilt libretro cores exist – the emulator manager builds none, so bundle cores.
ARCH=riscv64
FAMILY=riscv64
SUITE=trixie
MIRROR=http://deb.debian.org/debian
KERNEL="linux-image-riscv64"
BOOT=grub-efi-riscv64
PACKAGE_LISTS="base graphics audio firmware-arm emulators"
OPTIONAL_LISTS=""
NVIDIA=0
