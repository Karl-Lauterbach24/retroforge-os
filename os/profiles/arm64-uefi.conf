# Generic ARM64 with UEFI/EBBR firmware: Snapdragon X dev kits, Ampere, RK3588 with
# EDK2 (Orange Pi 5, Rock 5), Pinebook Pro with Tow-Boot, VMs (UTM/QEMU).
ARCH=arm64
FAMILY=arm64
SUITE=trixie
MIRROR=http://deb.debian.org/debian
KERNEL="linux-image-arm64"
BOOT=grub-efi-arm64
PACKAGE_LISTS="base graphics audio firmware-arm emulators"
OPTIONAL_LISTS=""
NVIDIA=0
