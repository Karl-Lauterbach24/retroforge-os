# Any 64-bit PC from ~2008 on: BIOS + UEFI (64- and 32-bit UEFI) hybrid image.
ARCH=amd64
FAMILY=x86_64
SUITE=trixie
MIRROR=http://deb.debian.org/debian
KERNEL="linux-image-amd64"
BOOT=grub-hybrid
PACKAGE_LISTS="base graphics audio firmware-x86 emulators"
OPTIONAL_LISTS="optional-x86"
# NVIDIA proprietary driver (Turing+ uses the open kernel module); selected at boot
NVIDIA=${NVIDIA:-1}
