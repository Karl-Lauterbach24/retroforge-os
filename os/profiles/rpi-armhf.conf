# Raspberry Pi 1 / Zero / Zero 2 / 2 / 3 in 32-bit mode (Pi Zero/1 need armhf=ARMv6:
# use Raspberry Pi OS armhf repos; Debian armhf requires ARMv7).
ARCH=armhf
FAMILY=arm32
SUITE=trixie
MIRROR=http://raspbian.raspberrypi.com/raspbian
RASPBIAN_KEY_PKG="http://raspbian.raspberrypi.com/raspbian raspbian-archive-keyring"
EXTRA_REPO="deb [signed-by=/usr/share/keyrings/raspberrypi-archive-keyring.gpg] http://archive.raspberrypi.com/debian trixie main"
EXTRA_KEY_PKG="https://archive.raspberrypi.com/debian raspberrypi-archive-keyring"
KERNEL="linux-image-rpi-v6 linux-image-rpi-v7 raspi-firmware"
BOOT=rpi
PACKAGE_LISTS="base graphics audio firmware-arm emulators"
OPTIONAL_LISTS=""
NVIDIA=0
