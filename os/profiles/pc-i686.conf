# 32-bit PCs (Pentium 4 / Atom / early Core). Debian 13 dropped i386 kernels,
# so this profile stays on Debian 12 (security support until 2028).
ARCH=i386
FAMILY=x86
SUITE=bookworm
MIRROR=http://deb.debian.org/debian
KERNEL="linux-image-686-pae"
BOOT=grub-hybrid32
PACKAGE_LISTS="base graphics audio firmware-x86 emulators"
OPTIONAL_LISTS=""
NVIDIA=0
